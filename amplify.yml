version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - node -v
        - npm ci
    build:
      commands:
        # Write ONLY the allowlisted vars into .env.production so the SSR runtime
        # can read them. Never grep the whole environment (it contains AWS creds).
        - |
          export BUILD_ID="${BUILD_ID:-$AWS_COMMIT_ID}"
          : > .env.production
          for name in APP_ROOT_DOMAIN APP_ENV TENANTS DEV_HOSTS DEV_TENANT_SLUG BUILD_ID \
                      TENANTS_TABLE TENANTS_TABLE_REGION ADMIN_PASSWORD; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> .env.production
              echo "wrote $name"
            else
              echo "skipped $name (unset)"
            fi
          done
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
